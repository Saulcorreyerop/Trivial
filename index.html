<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trivia</title>
    <link rel="stylesheet" href="estilos.css">
  </head>
  <body>
    <h1>🎯 Trivia</h1>

    <div id="app-container">
      <!-- Sidebar -->
      <div id="sidebar" class="oculto">
        <h3>Jugadores</h3>
        <ul id="sidebar-players-list"></ul>
      </div>

      <!-- Main content -->
      <div id="main-content">
        <div id="setup-screen" class="pantalla">
          <h2>Añadir Jugadores</h2>
          <input type="text" id="player-name-input" placeholder="Nombre del jugador..." />
          <button id="add-player-btn" class="btn-primario">Añadir</button>
          
          <div style="margin-top: 15px;">
            <ul id="players-list" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;"></ul>
          </div>

          <button id="start-game-btn" class="btn-exito oculto">¡Empezar Partida!</button>
        </div>

        <div id="game-screen" class="oculto">
          <div id="turn-indicator">
            Turno de: <span id="current-player-name"></span>
            <div style="font-size: 1rem; color: #333; margin-top: 5px;">Puntos: <span id="current-player-score">0</span></div>
          </div>

          <div id="wheel-container">
            <div class="wheel-pointer">
              <svg width="40" height="50" viewBox="0 0 40 50">
                <polygon points="20,50 5,10 20,0 35,10" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
                <circle cx="20" cy="15" r="4" fill="#fca5a5" />
              </svg>
            </div>
            <div id="wheel" class="wheel-idle" style="transform: rotate(0deg);">
              <svg viewBox="0 0 200 200" style="width: 100%; height: 100%;">
                <defs>
                  <filter id="slice-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="0" stdDeviation="2" flood-opacity="0.3" />
                  </filter>
                </defs>
                <!-- Slice 1: Geografía -->
                <path d="M100,100 L100,10 A90,90 0 0,1 190,100 Z" fill="#3b82f6" filter="url(#slice-shadow)" />
                <text x="100" y="45" fill="white" font-size="11" font-weight="bold" transform="rotate(45, 100, 100)" text-anchor="middle">🌍 Geografía</text>
                
                <!-- Slice 2: Deportes -->
                <path d="M100,100 L190,100 A90,90 0 0,1 100,190 Z" fill="#ec4899" filter="url(#slice-shadow)" />
                <text x="100" y="45" fill="white" font-size="11" font-weight="bold" transform="rotate(135, 100, 100)" text-anchor="middle">⚽ Deportes</text>
                
                <!-- Slice 3: Música -->
                <path d="M100,100 L100,190 A90,90 0 0,1 10,100 Z" fill="#eab308" filter="url(#slice-shadow)" />
                <text x="100" y="45" fill="white" font-size="11" font-weight="bold" transform="rotate(225, 100, 100)" text-anchor="middle">🎵 Música</text>
                
                <!-- Slice 4: Videojuegos -->
                <path d="M100,100 L10,100 A90,90 0 0,1 100,10 Z" fill="#8b5cf6" filter="url(#slice-shadow)" />
                <text x="100" y="45" fill="white" font-size="11" font-weight="bold" transform="rotate(315, 100, 100)" text-anchor="middle">🎮 Videojuegos</text>
                
                <circle cx="100" cy="100" r="25" fill="#1e1b4b" stroke="#fff" stroke-width="3" />
                <text x="100" y="104" fill="white" font-size="8" font-weight="bold" text-anchor="middle">GIRAR</text>
              </svg>
            </div>
            <button id="spin-btn">🎯 Girar Ruleta!</button>
          </div>

          <div id="question-panel">
            <p id="question-text">Selecciona una categoría para empezar.</p>

            <div class="timer-header">
              <span>Tiempo restante</span>
              <span id="timer-display"></span>
            </div>
            <div class="timer-track">
              <div id="timer-bar"></div>
            </div>

            <div id="options-container" class="options-container">
              <!-- Las opciones se generarán aquí con JavaScript -->
            </div>
            <p id="feedback-message"></p>

            <div id="quesitos-container">
              Quesitos ganados: 
              <span id="quesito-geografia" class="quesito-icono quesito-opaco" title="Geografía">🌍</span> 
              <span id="quesito-deportes" class="quesito-icono quesito-opaco" title="Deportes">⚽</span> 
              <span id="quesito-musica" class="quesito-icono quesito-opaco" title="Música">🎵</span>
              <span id="quesito-videojuegos" class="quesito-icono quesito-opaco" title="Videojuegos">🎮</span>
            </div>

            <div id="save-score-container" style="text-align: center; margin-top: 20px;">
              <br/>
              <button id="show-ranking-btn" class="btn-ranking">🏆 Ver Ranking Global</button>
            </div>

            <div id="ranking-display" class="oculto">
              <h2 style="text-align: center; margin-top: 0; color: #333;">Ranking Global</h2>
              <ul id="ranking-list"></ul>
            </div>
          </div>
        </div> <!-- Cierre de game-screen -->
      </div> <!-- Cierre de main-content -->
    </div> <!-- Cierre de app-container -->
    <script src="main.js" defer></script>
  </body>
</html>
